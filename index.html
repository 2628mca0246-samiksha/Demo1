<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your full name">
        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password">
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="1" name="gender" value="male">
        <label for="1">Male</label>

        <input type="radio" id="2" name="gender" value="female">
        <label for="2">Female</label>

        <br><br>

        <label>Hobbies:</label>

        <input type="checkbox" id="3" name="hobby" value="sports">
        <label for="3">Sports</label>

        <input type="checkbox" name="hobby" value="music">
        <label>Music</label>

        <input type="checkbox" name="hobby" value="reading">
        <label>Reading</label>

        <br><br>

        <label>Course:</label>

        <select>
            <option>Select your course</option>
            <option>MCA</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
        </select>

        <br><br>

        <label>Address:</label>
        <br>

        <textarea rows="6" cols="30" placeholder="Enter your address"></textarea>

        <br><br>

        <input type="button" value="Registration Done">
        <input type="submit" value="Submit">

    </form>

</body>
</html>
